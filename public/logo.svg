<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 264" width="100%" height="100%" role="img" aria-label="VibeCode Icon">
  <defs>
    <linearGradient id="bg_icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#241044"/>
    </linearGradient>
    <linearGradient id="accent_icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="48%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#BEF264"/>
    </linearGradient>
    <filter id="glow_icon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#22D3EE" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="264" height="264" rx="62" fill="url(#bg_icon)"/>
  <rect x="1" y="1" width="262" height="262" rx="61"
        fill="none" stroke="url(#accent_icon)" stroke-opacity=".45" stroke-width="2.5"/>

  <!-- Window dots -->
  <circle cx="48" cy="45" r="9" fill="#C084FC"/>
  <circle cx="75" cy="45" r="9" fill="#22D3EE"/>
  <circle cx="102" cy="45" r="9" fill="#BEF264"/>

  <!-- Left bracket < -->
  <path d="M91 95 51 132l40 37"
        fill="none" stroke="url(#accent_icon)" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right bracket > -->
  <path d="m173 95 40 37-40 37"
        fill="none" stroke="url(#accent_icon)" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor / Lightning lightning bolt center -->
  <path d="m111 82 82 57-39 9 15 53-24 7-15-53-31 20 12-93Z"
        fill="url(#accent_icon)" filter="url(#glow_icon)"/>

  <path d="m124 105 45 32-22 5 9 31-10 3-9-31-17 11 4-51Z"
        fill="#fff" opacity=".95"/>
</svg>

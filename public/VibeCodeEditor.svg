<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="VibeCodeEditor logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#241044"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="48%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#BEF264"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#020617" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="none"/>

  <!-- Icon -->
  <g transform="translate(48 48)" filter="url(#shadow)">
    <rect width="264" height="264" rx="62" fill="url(#bg)"/>
    <rect x="1" y="1" width="262" height="262" rx="61"
          fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>

    <circle cx="48" cy="45" r="8" fill="#C084FC"/>
    <circle cx="75" cy="45" r="8" fill="#22D3EE"/>
    <circle cx="102" cy="45" r="8" fill="#BEF264"/>

    <path d="M91 95 51 132l40 37"
          fill="none" stroke="url(#accent)" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path d="m173 95 40 37-40 37"
          fill="none" stroke="url(#accent)" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path d="m111 82 82 57-39 9 15 53-24 7-15-53-31 20 12-93Z"
          fill="url(#accent)"/>

    <path d="m124 105 45 32-22 5 9 31-10 3-9-31-17 11 4-51Z"
          fill="#fff" opacity=".9"/>
  </g>

  <!-- Wordmark -->
  <text x="365" y="179"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="76"
        font-weight="800"
        letter-spacing="-3"
        fill="currentColor">
    Vibe<tspan fill="url(#accent)">Code</tspan>Editor
  </text>

  <rect x="370" y="207" width="155" height="6" rx="3" fill="url(#accent)"/>

  <text x="370" y="252"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="6"
        fill="#94A3B8">
    CODE WITH FEELING
  </text>
</svg>
